name: Build and Push Frontend Image

# Builds the prebuilt frontend image (docker/frontend-image) and tests it.
# Pushes to Docker Hub only for commits on main and for release tags:
#   greencoding/gmt-frontend:latest       newest commit on main
#   greencoding/gmt-frontend:sha-<short>  every commit on main, to match the backend version
#   greencoding/gmt-frontend:<tag>        release tags like v4.2
# Pull requests only build and test the image.

on:
  push:
    branches:
      - main
    # Path filters do not apply to tag pushes, so every release tag builds an image
    tags:
      - 'v*'
    paths:
      - 'frontend/**'
      - 'docker/frontend-image/**'
      - 'docker/nginx/frontend.conf.example'
      - '.github/workflows/build-and-push-frontend-image.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - 'docker/frontend-image/**'
      - 'docker/nginx/frontend.conf.example'
      - '.github/workflows/build-and-push-frontend-image.yml'
  workflow_dispatch:

concurrency:
  group: frontend-image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: greencoding/gmt-frontend
  PUSH: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}

jobs:
  build-and-push-frontend-image:
    if: github.repository_owner == 'green-coding-solutions'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Eco CI Energy Estimation - Initialize
        if: github.event_name != 'pull_request'
        uses: green-coding-solutions/eco-ci-energy-estimation@main
        with:
          task: start-measurement
          project: "Green Metrics Tool"
          machine: "ubuntu-latest"
          tags: "CI/CD,Build-Frontend-Image-Workflow"
          gmt-api-token: ${{ secrets.GMT_API_TOKEN }}
          electricitymaps-api-token: ${{ secrets.ELECTRICITY_MAPS_ALT_TOKEN_INFO_AT_GCS }}

      - name: Eco CI Energy Estimation - Initialize (PR)
        if: github.event_name == 'pull_request'
        uses: green-coding-solutions/eco-ci-energy-estimation@main
        with:
          task: start-measurement
          project: "Green Metrics Tool"
          machine: "ubuntu-latest"
          tags: "CI/CD,Build-Frontend-Image-Workflow"
          gmt-api-token: ${{ secrets.GMT_API_TOKEN }}
          # Same as tests-vm-pr.yml. Workflows triggered by bots cannot access the Electricitymaps token
          co2-calculation-method: 'constant'
          co2-grid-intensity-constant: 231

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: 'false'

      # Needed for the arm64 build
      - name: Set up QEMU
        if: env.PUSH == 'true'
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image for testing
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/frontend-image/Dockerfile
          load: true
          tags: gmt-frontend:test
          cache-from: type=gha,scope=frontend-image
          cache-to: type=gha,scope=frontend-image,mode=max

      - name: Test image
        run: ./docker/frontend-image/test-image.sh gmt-frontend:test

      - name: Docker metadata
        if: env.PUSH == 'true'
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=tag
          labels: |
            org.opencontainers.image.title=Green Metrics Tool Frontend
            org.opencontainers.image.description=Prebuilt frontend of the Green Metrics Tool. Configure it with GMT_* environment variables or a mounted config.js.

      - name: Login to Docker Registry
        if: env.PUSH == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        if: env.PUSH == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/frontend-image/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=frontend-image

      - name: Eco CI Energy Estimation - Get Measurement
        uses: green-coding-solutions/eco-ci-energy-estimation@main
        with:
          task: get-measurement

      - name: Eco CI Energy Estimation - End Measurement
        uses: green-coding-solutions/eco-ci-energy-estimation@main
        with:
          task: display-results
