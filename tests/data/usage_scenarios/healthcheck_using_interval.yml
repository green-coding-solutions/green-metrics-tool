---
name: Test depends_on
author: David Kopp
description: test

services:
  test-container-1:
    image: alpine
    entrypoint: sleep infinity
    depends_on:
      test-container-2:
        condition: service_healthy
  test-container-2:
    build:
      context: ../slow-start-application
    healthcheck:
      test: pgrep -f 'sleep [i]nfinity' # [i] avoids matching the startup 'sleep 7' and the healthcheck's own shell
      interval: 1s
      retries: 10

flow:
  - name: dummy
    container: test-container-1
    commands:
      - type: console
        command: pwd
