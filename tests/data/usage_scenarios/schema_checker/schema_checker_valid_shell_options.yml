---
name: Test
author: Dan Mateas
description: test

services:
  test-container:
    image: gcb_stress
    build: .
    setup-commands:
      - command: ps -a
        shell: sh
        shell-options: ['-o', 'errexit']

flow:
  - name: Stress
    container: test-container
    commands:
      - type: console
        command: stress-ng -c 1 -t 1 -q
        note: Starting Stress
        shell: bash
        shell-options: -o errexit -o pipefail
      - type: console
        command: echo 1
        shell: sh
        shell-options: []
