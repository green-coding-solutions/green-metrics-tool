---
name: Test Stress
author: Dan Mateas
description: test

services:
  test-container:
    image: gcb_stress
    entrypoint: tail -f /dev/null
    build:
      context: ../stress-application
    environment:
      MY_TEXT: __GMT_VAR_TEXT__

flow:
  - name: Stress
    container: test-container
    commands:
      - type: console
        shell: sh
        command: echo '__GMT_VAR_TEXT__|quote'
        note: Echoing quoted variable
