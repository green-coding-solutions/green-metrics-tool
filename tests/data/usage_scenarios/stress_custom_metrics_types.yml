---
name: Test Stress Custom Metrics Types
author: Didi Hoffmann
description: Custom metrics of every type next to a custom metric without a type (TOTAL)

custom_metrics:
  open_fds:
    unit: count
    type: MEAN
  files_stored:
    unit: count
    type: LAST
  api_hits:
    unit: API Hits

services:
  test-container:
    image: gcb_stress
    entrypoint: sleep infinity
    build:
      context: ../stress-application

flow:
  - name: Stress
    container: test-container
    commands:
      - type: console
        shell: sh
        command: TS=$(date +%s%N); echo "$TS open_fds=10"; echo "$TS files_stored=10"; echo "$TS api_hits=33"; stress-ng -c 1 -t 1 -q
      - type: console
        shell: sh
        command: TS=$(date +%s%N); echo "$TS open_fds=30"; echo "$TS files_stored=30"; echo "$TS api_hits=44"; stress-ng -c 1 -t 1 -q
