---
name: Test Dependency Resolving
author: David Kopp
description: Test Dependency Resolving

services:
  test-container:
    image: greencoding/gcb_playwright:v20
    setup-commands:
      - shell: bash
        command: |
          cd /root
          python3 -m virtualenv venv
          /root/venv/bin/pip install psutils
          timeout 180 apt update
          apt -o Acquire::http::ConnectTimeout=10 -o Acquire::https::ConnectTimeout=10 install nano

flow:
  - name: Stress
    container: test-container
    commands:
      - type: console
        command: echo "Test"
