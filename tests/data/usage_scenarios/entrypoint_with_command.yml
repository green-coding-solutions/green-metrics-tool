---
name: Test Stress
author: David Kopp
description: test

services:
  test-container:
    image: gcb_stress_entrypoint # image with an endpoint
    build:
      context: ../entrypoint-application
    entrypoint: 'sleep' # overwrite entrypoint
    command: 'infinity' # value of command is used as an argument for the entrypoint -> `sleep infinity`

flow:
  - name: Stress
    container: test-container
    commands:
      - type: console
        command: stress-ng -c 1 -t 1 -q
        note: Starting Stress
