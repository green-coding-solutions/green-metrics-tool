---
name: AI model
author: Arne Tarara <arne@green-coding.io>
description: Run an inference with a small AI model on the CPU

services:
  gcb-ai-model:
    image: ollama/ollama:latest
    docker-run-args:
      - -v ollama:/root/.ollama

flow:
  - name: Download model
    container: gcb-ai-model
    commands:
      - type: console
        command: >-
          ollama pull __GMT_VAR_MODEL__
        read-notes-stdout: true
        log-stdout: true

  - name: Load model into memory
    container: gcb-ai-model
    commands:
      - type: console
        command: >-
          ollama run __GMT_VAR_MODEL__
        read-notes-stdout: true
        log-stdout: true

  - name: Run Inference
    container: gcb-ai-model
    commands:
      - type: console
        shell: bash
        command: >-
          ollama run '__GMT_VAR_MODEL__|quote' '__GMT_VAR_PROMPT__|quote'
        read-notes-stdout: true
        log-stdout: true