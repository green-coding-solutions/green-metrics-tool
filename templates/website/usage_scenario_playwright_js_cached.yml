---
name: "Website User Journey (__GMT_VAR_PAGE__)"
author: Didi Hoffmann <didi@green-coding.io>
description: "Opens __GMT_VAR_PAGE__ from a cache and then runs a user supplied user journey (Playwright JavaScript)"

custom_metrics:
  website_user_journey:
    unit: Website User Journey
    sci: True

compose-file: !include-gmt-helper gmt-playwright-with-cache.yml

# __GMT_VAR_SCRIPT_B64__ is the base64 encoded body of the user supplied user journey.
# It must be encoded, because usage scenario variables are string replaced into this file before it is parsed as
# YAML and the resulting command is then passed through `sh -ec "echo '<command>' > <fifo>"` in lib/scenario_runner.py.
# Neither step survives arbitrary newlines and quotes, but the base64 alphabet passes both untouched.

flow:
  - name: Warmup and Caching
    container: gmt-playwright-nodejs
    hidden: true
    commands:
      - type: playwright
        command: await page.goto("__GMT_VAR_PAGE__");
      - type: playwright
        command: await gmtRunScriptB64("__GMT_VAR_SCRIPT_B64__");
      - type: console
        command: sleep __GMT_VAR_SLEEP__
      - type: playwright
        command: await gmtPlaywrightResetContext();

  - name: Open page
    container: gmt-playwright-nodejs
    hidden: true
    commands:
      - type: playwright
        command: page_result = await page.goto("__GMT_VAR_PAGE__");

  - name: Check HTTP Status Code
    container: gmt-playwright-nodejs
    hidden: true
    commands:
      - type: playwright
        command: if (!page_result.ok()) throw `Page was not accessible. HTTP Return code ${page_result.status()}`

  - name: Run User Journey
    container: gmt-playwright-nodejs
    commands:
      - type: playwright
        command: await gmtRunScriptB64("__GMT_VAR_SCRIPT_B64__");
      - type: console
        command: echo $(date +%s%N) website_user_journey=1
        shell: sh
